# Networking
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_TCP=y

# WiFi
CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y

# Stack sizes for ESP32
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096


CONFIG_SPI=y
CONFIG_GPIO=y

# Network buffers (increased for HTTP)
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64

# Logging
CONFIG_LOG=y
CONFIG_NET_LOG=y

# WiFi credentials are intentionally NOT stored here.
# Copy prj.local.conf.example to prj.local.conf (git-ignored), fill in your
# network, and build with:
#   west build -b esp32_devkitc_procpu -- -DEXTRA_CONF_FILE=prj.local.conf
CONFIG_WIFI_SSID=""
CONFIG_WIFI_PSK=""


# Sockets
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y

# HTTP Client
CONFIG_HTTP_CLIENT=y

# DNS Resolver
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="8.8.8.8"

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y

CONFIG_JSON_LIBRARY=y
